<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>MAZE.EXE — Retro Terminal Maze Arcade</title>
    <meta
      name="description"
      content="MAZE.EXE is a retro terminal maze arcade: collect bits for combo points, dodge the daemons, grab antivirus pills and reach the exit session after session. Keyboard, gamepad and touch supported."
    />
    <meta name="author" content="Armando" />
    <meta
      name="keywords"
      content="maze game, arcade, retro, terminal, 8-bit, browser game, maze, daemon, chiptune"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#06110a" />
    <link rel="canonical" href="https://arcade-the-maze.vercel.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:site_name" content="MAZE.EXE" />
    <meta property="og:title" content="MAZE.EXE — Retro Terminal Maze Arcade" />
    <meta
      property="og:description"
      content="Collect bits for combo points, dodge the daemons and reach the exit. A CRT-green retro arcade that runs in your browser."
    />
    <meta property="og:url" content="https://arcade-the-maze.vercel.app/" />
    <meta
      property="og:image"
      content="https://arcade-the-maze.vercel.app/social-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="MAZE.EXE gameplay screenshot — green maze with HUD on a dark CRT background" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MAZE.EXE — Retro Terminal Maze Arcade" />
    <meta
      name="twitter:description"
      content="Collect bits for combo points, dodge the daemons and reach the exit. A CRT-green retro arcade that runs in your browser."
    />
    <meta
      name="twitter:image"
      content="https://arcade-the-maze.vercel.app/social-card.png"
    />
    <meta name="twitter:image:alt" content="MAZE.EXE gameplay screenshot — green maze with HUD on a dark CRT background" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "MAZE.EXE",
        "genre": ["Arcade", "Maze", "Retro"],
        "description": "Retro terminal maze arcade. Collect bits for combo points, dodge daemons and the glitch, grab antivirus pills and reach the exit.",
        "operatingSystem": "Any (web browser)",
        "browserRequirements": "Requires JavaScript and an audio-capable browser",
        "applicationCategory": "Game",
        "url": "https://arcade-the-maze.vercel.app/",
        "image": "https://arcade-the-maze.vercel.app/social-card.png",
        "playMode": "SinglePlayer"
      }
    </script>
  </head>
  <body>
    <div class="frame">
      <div id="hud">
        <span>SESSION <span class="value" id="session">01</span></span>
        <span id="player"></span>
        <span id="combo"></span>
        <span><span class="value" id="score">000000</span> SCORE</span>
        <span>LIVES <span class="value" id="lives">@@@</span></span>
        <span id="fright"></span>
        <span id="mute"></span>
        <span id="status">RAIDING</span>
        <canvas id="visualizer"></canvas>
      </div>
      <canvas id="game"></canvas>
      <div id="boot">
        <pre id="boot-text"></pre>
      </div>
      <div id="touch-controls" aria-hidden="true">
        <div id="dpad">
          <button class="dpad-btn dpad-up" data-key="ArrowUp" aria-label="Up">▲</button>
          <button class="dpad-btn dpad-left" data-key="ArrowLeft" aria-label="Left">◀</button>
          <button class="dpad-btn dpad-down" data-key="ArrowDown" aria-label="Down">▼</button>
          <button class="dpad-btn dpad-right" data-key="ArrowRight" aria-label="Right">▶</button>
        </div>
        <div id="action-buttons">
          <button class="action-btn" data-key="Enter" aria-label="Start">▶ START</button>
          <button class="action-btn action-pause" data-key="p" aria-label="Pause">PAUSE</button>
          <button class="action-btn" data-key="m" aria-label="Mute">MUTE</button>
        </div>
      </div>
    </div>
    <div id="crt"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
